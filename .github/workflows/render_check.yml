name: Persian Render Check

# Renders sample slides with the production code path and uploads them as an
# artifact, so the Persian text shaping can be verified on the runner image
# (ubuntu-latest + Pillow wheel ships libraqm) without touching YouTube quota.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install rendering dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render sample slides
        run: python render_check.py

      - name: Upload rendered slides
        uses: actions/upload-artifact@v4
        with:
          name: persian-render-check
          path: render_check/*.png
          if-no-files-found: error
          retention-days: 7
