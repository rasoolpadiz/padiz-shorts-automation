name: Padiz Daily Analytics

on:
  schedule:
    # 04:00 UTC = 07:30 Tehran. Runs BEFORE the first Short (09:30) and before the
    # long-form build (15:30), so both pickers already have fresh numbers.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: padiz-analytics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Read-only. Uses the existing token (youtube.readonly) - no new secret.
      - name: Collect channel analytics
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          python analytics.py || echo "::warning::analytics collection failed - pickers will use the default order"

      - name: Commit analytics snapshot
        run: |
          git config --global user.name "Padiz Automation Bot"
          git config --global user.email "bot@padiz.local"
          git add -f analytics_history.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "chore: analytics snapshot [skip ci]"
            git push origin HEAD:main
          fi
