name: Padiz Daily Analytics

on:
  schedule:
    # 04:00 UTC = 07:30 Tehran. Runs BEFORE the first Short (09:30) and before the
    # long-form build (15:30), so both pickers already have fresh numbers.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: padiz-analytics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Read-only. Uses the existing token (youtube.readonly) - no new secret.
      - name: Collect channel analytics
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          python analytics.py || echo "::warning::analytics collection failed - pickers will use the default order"

      - name: Commit analytics + discovery state
        run: |
          git config --global user.name "Padiz Automation Bot"
          git config --global user.email "bot@padiz.local"
          git add -f analytics_history.json discovery_pool.json discovery_quota.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "chore: analytics + discovery snapshot [skip ci]"
            git push origin HEAD:main
          fi

      # What is hot RIGHT NOW inside the owner's approved niches. The writer
      # (gen_topics) reads discovery_pool.json as its research brief.
      # Read-only, and skipped automatically if it fails - the daily video must
      # never be blocked by discovery.
      - name: Discover hot topics on the internet
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          for LANG in fa en; do
            python discover.py --lang "$LANG" --niches 2 \
              || echo "::warning::discovery failed for $LANG - writers use the plain niche"
          done

      - name: Commit discovery pool
        run: |
          git add -f discovery_pool.json discovery_quota.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "chore: discovery pool [skip ci]"
            git push origin HEAD:main
          fi

