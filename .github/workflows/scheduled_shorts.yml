name: Padiz 24/7 Shorts Automation

on:
  schedule:
    # Runs 5 times a day (UTC times -> Tehran times UTC+3:30):
    # 06:00 UTC = 09:30 Tehran
    # 10:00 UTC = 13:30 Tehran
    # 14:00 UTC = 17:30 Tehran
    # 17:00 UTC = 20:30 Tehran
    # 20:00 UTC = 23:30 Tehran
    - cron: '0 6,10,14,17,20 * * *'
  workflow_dispatch:
    inputs:
      test_only:
        description: "فقط تست (پیدا کردن + دانلود + برندینگ) بدون آپلود به یوتیوب"
        type: boolean
        default: false

permissions:
  contents: write

# Cron triggers on shared runners can bunch up when they are delayed, and two
# overlapping runs would upload two Shorts at once. Queue them instead.
concurrency:
  group: padiz-shorts-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start YouTube PO-token provider (fixes "Sign in to confirm you're not a bot")
        run: |
          docker run --name bgutil-provider -d --init --shm-size=1g \
            -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider
          echo "--- waiting for the provider to come up ---"
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:4416/; then echo "up after $i tries"; break; fi
            sleep 2
          done
          docker logs bgutil-provider 2>&1 | tail -5
          echo "--- warm-up: metadata fetch through a PO token (mweb is the recommended client) ---"
          ok=0
          for client in mweb web tv; do
            for i in 1 2 3; do
              if python -m yt_dlp --skip-download --no-warnings -v \
                   --extractor-args "youtube:player_client=$client" \
                   "https://www.youtube.com/watch?v=jNQXAC9IVRw" 2>pot_warmup.txt; then
                echo "warm-up OK with client $client on attempt $i"
                ok=1
                break 2
              fi
              echo "warm-up ($client) attempt $i failed, retrying in 15s ..."
              sleep 15
            done
          done
          echo "--- PO token lines from the warm-up ---"
          grep -iE "pot|token" pot_warmup.txt | head -20 || true
          echo "--- tail of the warm-up log ---"
          tail -6 pot_warmup.txt || true
          if [ "$ok" != "1" ]; then
            echo "::warning::PO-token warm-up did not succeed; the viral download may be refused"
          fi

      - name: Run automated Shorts pipeline
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # YouTube refuses yt-dlp downloads from datacenter IPs without a proof-of-origin
          # token. The container started above provides it (no Google account needed).
          # A cookie jar stays supported as a fallback: create it with
          # `python make_cookies.py` and store the printed base64 as this secret.
          YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
          # test_only=true from the "Run workflow" button: no upload, no state change.
          VIRAL_DRY_RUN: ${{ inputs.test_only && '1' || '0' }}
          # Optional: restrict the viral hunter to Creative Commons videos.
          # VIRAL_LICENSE: creativeCommon
        run: |
          python run_daily.py

      - name: Stop PO-token provider
        if: always()
        run: docker rm -f bgutil-provider || true

      - name: Commit and push updated state
        run: |
          git config --global user.name "Padiz Automation Bot"
          git config --global user.email "bot@padiz.local"
          git add -f posted_shorts.json
          if [ -f processed_reels.json ]; then git add -f processed_reels.json; fi
          if git diff --staged --quiet; then
            echo "No state change to commit."
          else
            git commit -m "chore: update posted shorts state [skip ci]"
            # actions/checkout leaves a detached HEAD, so the target branch must
            # be named explicitly - a bare "git push" fails there.
            git push origin HEAD:main
          fi
