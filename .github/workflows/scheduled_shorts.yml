name: Padiz 24/7 Shorts Automation

on:
  schedule:
    # Runs 5 times a day (UTC times -> Tehran times UTC+3:30):
    # 06:00 UTC = 09:30 Tehran
    # 10:00 UTC = 13:30 Tehran
    # 14:00 UTC = 17:30 Tehran
    # 17:00 UTC = 20:30 Tehran
    # 20:00 UTC = 23:30 Tehran
    - cron: '0 6,10,14,17,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Cron triggers on shared runners can bunch up when they are delayed, and two
# overlapping runs would upload two Shorts at once. Queue them instead.
concurrency:
  group: padiz-shorts-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated Shorts pipeline
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          python run_daily.py

      - name: Commit and push updated state
        run: |
          git config --global user.name "Padiz Automation Bot"
          git config --global user.email "bot@padiz.local"
          git add -f posted_shorts.json
          if [ -f processed_reels.json ]; then git add -f processed_reels.json; fi
          if git diff --staged --quiet; then
            echo "No state change to commit."
          else
            git commit -m "chore: update posted shorts state [skip ci]"
            # actions/checkout leaves a detached HEAD, so the target branch must
            # be named explicitly - a bare "git push" fails there.
            git push origin HEAD:main
          fi
