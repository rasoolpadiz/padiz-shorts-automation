name: Padiz 24/7 Shorts Automation

on:
  schedule:
    # 3 Shorts/day (owner directive 2026-10-03, lowered from 5 after YouTube
    # returned uploadLimitExceeded). Tehran = UTC+3:30:
    # 10:00 UTC = 13:30 Tehran -> FA (Iran lunch peak)
    # 14:00 UTC = 17:30 Tehran -> EN (EU lunch / US morning)
    # 17:00 UTC = 20:30 Tehran -> FA (Iran evening prime)
    - cron: '0 10,14,17 * * *'
    # Catch-up slots, +2h after each primary. GitHub's cron is best-effort and
    # it silently DROPPED the 06:00 UTC slot on 2026-10-02 (zero runs that day),
    # so a missed slot needs a second chance. Safe to duplicate: run_daily has a
    # 90-minute minimum gap AND a hard 3 Shorts/day cap, so a catch-up after
    # a successful primary becomes a harmless no-op instead of an extra upload.
    - cron: '0 12,16,19 * * *'
  workflow_dispatch:
    inputs:
      test_only:
        description: "فقط تست (پیدا کردن + دانلود + برندینگ) بدون آپلود به یوتیوب"
        type: boolean
        default: false
      force_upload:
        description: "تست واقعی: نادیده‌گرفتن فاصله/سقف روزانه و آپلود واقعی"
        type: boolean
        default: false
      force_lang:
        description: "Force language: fa | en | empty=slot schedule"
        type: choice
        options: ["", fa, en]
        default: ""

permissions:
  contents: write

# Cron triggers on shared runners can bunch up when they are delayed, and two
# overlapping runs would upload two Shorts at once. Queue them instead.
concurrency:
  group: padiz-shorts-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg + fonts)
        # -qq keeps the log small; do NOT remove this step - system packages
        # are NOT cached between runners, so a fresh install is required.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Keep a small buffer of freshly-discovered Shorts so run_daily always has
      # something new. Owner directive: Shorts should also come from the internet,
      # not only from the fixed pool. Runs for BOTH languages only when at least
      # MIN_GAP_MINUTES has passed since the last upload - otherwise the run is a
      # no-op anyway, so the 2 Gemini text calls of the top-up are skipped and
      # the minutes budget only pays for checkout + setup (~1-2 min).
      - name: Top up dynamic Shorts from discovered topics
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # A forced verification run must always write a fresh mined Short -
          # otherwise the pipeline falls back to the static pool and the video
          # is not built from the online content.
          FORCE_TOPUP: ${{ (inputs.force_upload || inputs.test_only) && '1' || '0' }}
        run: |
          python - <<'PY' || echo "::warning::shorts top-up failed - using the static pool"
          import os, sys
          sys.path.insert(0, os.getcwd())
          from datetime import datetime, timezone
          import run_daily as RD
          # Cheap gate: if this run will exit early (gap/cap), skip the writer -
          # top-ups also cover tomorrow, but one no-op run does not need them.
          gap = RD.minutes_since_last_post(RD.load_posted())
          need_topup = (os.environ.get("FORCE_TOPUP", "") == "1")
          # Mining is the ONLY source of text now, so always try to mine at least
          # one topic per language. Without this the run finds an empty pool and
          # publishes nothing.
          want = 2 if need_topup else 1
          if need_topup or gap is None or gap >= RD.MIN_GAP_MINUTES:
              import gen_shorts as GS
              for lang in ("fa", "en"):
                  try:
                      made = GS.top_up(lang, want)
                      print(f"[shorts] {lang}: {len(made)} new")
                  except Exception as e:
                      print(f"[shorts] {lang} top-up failed: {e}")
          else:
              print(f"[shorts] last upload {gap:.0f}m ago - writer skipped")
          PY

      - name: Run automated Shorts pipeline (FA/EN self-made, no downloader)
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # FORCE_LANG: fa | en | empty (empty = slot->lang forcing by UTC hour)
          FORCE_LANG: ${{ inputs.force_lang || '' }}
          FORCE_UPLOAD: ${{ inputs.force_upload && '1' || '0' }}
          TEST_ONLY: ${{ inputs.test_only && '1' || '0' }}
        run: |
          python run_daily.py

      - name: Upload rendered Short (manual mode)
        if: inputs.test_only == true
        uses: actions/upload-artifact@v4
        with:
          name: manual-short
          path: short_out/*.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Commit and push updated state
        if: always()
        run: |
          git config --global user.name "Padiz Automation Bot"
          git config --global user.email "bot@padiz.local"
          # State files first - posted_shorts.json is the source of truth.
          git add -f posted_shorts.json
          if [ -f processed_reels.json ]; then git add -f processed_reels.json; fi
          git add -f shorts_generated || true
          if git diff --staged --quiet; then
            echo "No state change to commit."
            exit 0
          fi
          git commit -m "chore: update posted shorts state [skip ci]"
          # actions/checkout leaves a detached HEAD, so the target branch must
          # be named explicitly. pull --rebase first: local docs commits can
          # otherwise make origin/main move ahead and reject the push.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            echo "push attempt $i failed - retrying after rebase..."
            sleep 5
          done
          git status --short
