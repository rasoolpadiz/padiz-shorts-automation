name: Padiz Daily Long-Form Video

on:
  schedule:
    # 12:00 UTC = 15:30 Tehran - one long video (>= 8 min) per day
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic id (empty = auto pick EN/FA)"
        type: string
        default: ""
      upload:
        description: "Upload to YouTube (unchecked = render only)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: padiz-longform-publish
  cancel-in-progress: false

jobs:
  build-and-publish-long:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build + upload long video
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.topic }}" ]; then ARGS="$ARGS --topic ${{ inputs.topic }}"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.upload }}" = "true" ]; then
            ARGS="$ARGS --upload"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="$ARGS --upload"
          fi
          python run_long_daily.py $ARGS

      - name: Commit state + generated topics + credits
        run: |
          git config --global user.name "Padiz Automation Bot"
          git config --global user.email "bot@padiz.local"
          git add -f longform_out/posted_long.json
          git add -f topics_generated
          git add -f longform_images || true
          if git diff --staged --quiet; then
            echo "No state change to commit."
          else
            git commit -m "chore: update longform state [skip ci]"
            git push origin HEAD:main
          fi