name: Padiz Daily Long-Form Video

on:
  schedule:
    # Primary slot: 12:00 UTC = 15:30 Tehran (best for both monetization + discovery).
    # GitHub's cron is best-effort and has already misfired here - on
    # 2026-09-30 it ran 5h49m late and on 2026-10-01 it was skipped entirely.
    # So the workflow also fires catch-up slots; run_long_daily.py publishes at
    # most ONE long video per day, so a late duplicate is a harmless no-op.
    - cron: '0 12 * * *'    # 15:30 Tehran (primary)
    - cron: '30 13 * * *'   # 17:00 Tehran (catch-up 1)
    - cron: '0 15 * * *'    # 18:30 Tehran (catch-up 2)
    - cron: '30 16 * * *'   # 20:00 Tehran (catch-up 3)
    - cron: '0 18 * * *'    # 21:30 Tehran (catch-up 4)
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic id (empty = auto pick EN/FA)"
        type: string
        default: ""
      upload:
        description: "Upload to YouTube (unchecked = render only)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: padiz-longform-publish
  cancel-in-progress: false

jobs:
  build-and-publish-long:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build + upload long video
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.topic }}" ]; then ARGS="$ARGS --topic ${{ inputs.topic }}"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.upload }}" = "true" ]; then
            ARGS="$ARGS --upload"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="$ARGS --render"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="$ARGS --upload"
          fi
          # Fail fast (clear message) if a Python dependency is missing.
          python -c "import numpy, PIL, edge_tts, googleapiclient, arabic_reshaper, bidi; print('deps OK')"
          # run_long_daily.py (unlike run_daily.py) never materialises token.pickle
          # itself, so decode the secret here or the upload dies with FileNotFoundError.
          python -c "import base64,os,pathlib;t=os.environ.get('YOUTUBE_TOKEN_B64','').strip();p=pathlib.Path('token.pickle');(p.write_bytes(base64.b64decode(t)) if (t and not p.exists()) else None);print('[CI] token.pickle ->', p.stat().st_size if p.exists() else 'MISSING')"
          echo "[CI] Running: python run_long_daily.py $ARGS"
          python run_long_daily.py $ARGS
          echo "[CI] Exit code: $?"

      - name: Commit state + generated topics + credits
        run: |
          git config --global user.name "Padiz Automation Bot"
          git config --global user.email "bot@padiz.local"
          git add -f longform_out/posted_long.json
          git add -f topics_generated
          git add -f longform_images || true
          if git diff --staged --quiet; then
            echo "No state change to commit."
          else
            git commit -m "chore: update longform state [skip ci]"
            git push origin HEAD:main
          fi